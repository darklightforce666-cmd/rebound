# REBOUND V3 workers. Secrets are files under ./runtime-secrets (mode 700/600), mounted read-only;
# they are never baked into the image, committed, or stored in Supabase/Netlify.
#   docker compose -f compose.rewards.yml --env-file .env.worker up -d --build indexer            # read-only indexing
#   docker compose -f compose.rewards.yml --env-file .env.worker --profile settle up -d --build   # + scheduler (signs)
# The scheduler refuses to sign above REWARDS_MAX_EXECUTION_MODE and when the on-chain deployment
# does not match its keys (preflight). Pause from the admin dashboard or the guardian key.
x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.rewards
  env_file: .env.worker
  restart: unless-stopped
  read_only: true
  security_opt: ['no-new-privileges:true']
  volumes: ['./runtime-secrets:/run/secrets:ro']
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '5'}
services:
  indexer:
    <<: *worker
    environment:
      REWARDS_WORKER_ROLE: indexer
      INDEXER_DATABASE_URL_FILE: /run/secrets/indexer-database.url
  scheduler:
    <<: *worker
    profiles: [settle]
    environment:
      REWARDS_WORKER_ROLE: scheduler
      SCHEDULER_DATABASE_URL_FILE: /run/secrets/scheduler-database.url
      VERIFIER_DATABASE_URL_FILE: /run/secrets/verifier-database.url
      INDEXER_DATABASE_URL_FILE: /run/secrets/indexer-database.url
      REWARDS_PUBLISHER_KEY_FILE: /run/secrets/publisher.json
      REWARDS_VERIFIER_KEY_FILE: /run/secrets/verifier.json
      REWARDS_FEE_PAYER_KEY_FILE: /run/secrets/fee_payer.json
      REWARDS_SIGNER_MASTER_KEY_FILE: /run/secrets/signer-master.key   # encrypts imported fee-wallet keys at rest
      REWARDS_INBOX_KEY_FILE: /run/secrets/inbox.jwk                   # dashboard seals fee-wallet keys to this key
