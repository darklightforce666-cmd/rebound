[build]
  command = "node scripts/build.cjs"
  # Skip the site build when a push only touches the hosted worker, tests, docs or contracts (they never reach
  # the site or its functions). Exit code 0 = nothing relevant changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)supabase' ':(exclude)tests' ':(exclude)docs' ':(exclude)contracts' ':(exclude)README.md'"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/preview/REBOUND.html"
  to = "/"
  status = 301
