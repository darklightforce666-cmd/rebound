<g fill="#225a3c" fill-opacity=".18" stroke="#8bcaa6" stroke-opacity=".16"><rect x="950" y="122" width="25" height="25" rx="6" transform="rotate(-14 962 134)"/><rect x="1397" y="312" width="36" height="36" rx="9" transform="rotate(14 1415 330)"/><rect x="1365" y="79" width="19" height="19" rx="5" transform="rotate(12 1374 88)"/></g>
